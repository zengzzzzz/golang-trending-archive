# This workflow archives GitHub trending projects monthly.

name: Monthly Github Trending Archive

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: |
          python arcived_month.py

      - name: Check for changes
        id: git-status
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.git-status.outputs.changed == 'true'
        run: |
          echo start push
          git config user.name "zengzzzzz"
          git config user.email "mrzengzzzz@gmail.com"

          git commit -m "$(date '+%Y-%m-%d')"
          git push
